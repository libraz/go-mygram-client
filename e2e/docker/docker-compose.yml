# Self-contained e2e stack for the MygramDB Go client.
#
# Brings up MySQL (seeded with a fixed dataset) and a MygramDB server that
# replicates from it, so `go test -tags=e2e` can run against a real server with
# deterministic data. Nothing outside this directory is required — the server
# is pulled as a published image.
#
#   docker compose -f e2e/docker/docker-compose.yml up -d --wait
#   MYGRAM_E2E_SEEDED=1 go test -tags=e2e -count=1 ./...
#   docker compose -f e2e/docker/docker-compose.yml down -v
#
# Override the server version with MYGRAMDB_VERSION (defaults to the v1.12
# line) and the administrative token with MYGRAM_ADMIN_TOKEN.

# The project name is declared here rather than inferred from the directory
# name, which would be "docker" — a name any other stack in a directory called
# `docker` also claims. Without it, `up` adopts that stack's `mysql` service and
# `down -v` tears the whole thing down.
#
# Container names are left to compose so they inherit that project prefix.
# A fixed container_name is global to the docker daemon, so a sibling client
# repo running its own equivalent stack would collide on the literal name.
name: go-mygram-e2e

services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-test_root_password}
      MYSQL_DATABASE: testdb
      MYSQL_USER: repl_user
      MYSQL_PASSWORD: test_password
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      # Replication reads column metadata from TABLE_MAP events (v1.11 and later).
      - --binlog-row-metadata=FULL
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Use TCP (127.0.0.1), not the socket, so the probe only passes once the
      # real server is up — the temporary init-time server is socket-only, so a
      # socket ping would go green before the seed scripts have finished.
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  mygramdb:
    image: ghcr.io/libraz/mygram-db:${MYGRAMDB_VERSION:-1.12.0}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Use the mounted config verbatim instead of the image's env-based generator.
      SKIP_CONFIG_GEN: "true"
      # The image requires a replication password from v1.10 rather than
      # substituting a placeholder that would only surface later as an error.
      MYSQL_PASSWORD: test_password
      # Overrides api.admin_token in the mounted config, so the token lives in
      # one place for both the server and the test run.
      MYGRAM_API_ADMIN_TOKEN: ${MYGRAM_ADMIN_TOKEN:-e2e_admin_token}
    command: ["mygramdb", "-c", "/etc/mygramdb/config.yaml"]
    volumes:
      - ./mygramdb.yaml:/etc/mygramdb/config.yaml:ro
    ports:
      - "${MYGRAM_PORT:-11016}:11016"   # TCP protocol (used by the client)
      - "${MYGRAM_HTTP_PORT:-18080}:8080"  # HTTP API / health probes
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
